# ===== LIVE SERVER: every secret comes from environment variables, nothing is hard-coded =====
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1700000
# 'update' is fine for the first deployment; move to Flyway migrations + 'validate' once data is live (see DEPLOY.md)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.thymeleaf.cache=true
server.servlet.session.cookie.secure=true
server.forward-headers-strategy=framework
app.require-https=true
app.staff-code=${STAFF_CODE}
# set only for the FIRST start so the BHW account exists, then remove the variable
app.bootstrap.bhw-password=${BOOTSTRAP_BHW_PASSWORD:}
app.bootstrap.midwife-password=
