spring.application.name=Barangay Jibolo Child Immunization Scheduling and Monitoring System
# dev = local XAMPP (default). On a server set SPRING_PROFILES_ACTIVE=prod
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
server.port=${PORT:8081}
spring.mvc.format.date=iso
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Manila
server.shutdown=graceful
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
server.error.include-stacktrace=never
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
app.require-https=false
