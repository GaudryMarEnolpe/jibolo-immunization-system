<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Notice')}"></head>
<body>
<div class="container d-flex align-items-center justify-content-center" style="min-height:100vh">
  <div class="card text-center p-4 p-md-5 fade-up" style="max-width:480px">
    <div class="brand-badge mx-auto mb-3" style="width:56px;height:56px;font-size:1.6rem"><i class="bi bi-shield-plus"></i></div>
    <h4 th:text="${status == 403} ? 'Access not allowed' : (${status == 404} ? 'Page not found' : (${status == 400 or status == 405} ? 'Request not valid' : 'Something went wrong'))">Notice</h4>
    <p class="text-muted mb-1" th:text="${status == 403} ? 'You do not have permission to open this page. Health records are private to the family and authorized health workers.' : (${status == 404} ? 'We could not find that page or record.' : (${status == 400 or status == 405} ? 'That request could not be processed.' : 'We are sorry, the system could not finish that. Your records were not lost. Please try again.'))"></p>
    <p class="small text-muted" th:if="${ref != null}" th:text="'Reference: ' + ${ref}"></p>
    <a class="btn btn-success mt-3" th:href="@{/}"><i class="bi bi-house me-1"></i>Go to my home page</a>
  </div></div>
</body></html>
